<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="考纲词汇" />
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>中高考英语词汇记忆动画</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1e293b;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .app {
    width: 100%;
    max-width: 920px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }
  /* Top Bar */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 20px;
    background: linear-gradient(135deg, #eef2ff 0%, #ffffff 100%);
    border-bottom: 1px solid var(--border);
  }
  .top-left {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .icon-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn.starred { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
  .icon-btn.mastered { background: #dcfce7; border-color: #10b981; color: #047857; }

  .word-meta {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .word-title {
    font-size: 25px;
    font-weight: 800;
    color: var(--primary);
  }
  .phonetic {
    font-size: 14px;
    color: var(--muted);
    font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
  }
  .pos-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--primary-light);
    color: var(--primary);
  }
  .meaning {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .top-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .act-dots {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .dot.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    transform: scale(1.06);
  }

  /* Stage */
  .stage-wrap {
    position: relative;
    background: #f8fafc;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  svg#stage { width: 100%; height: 100%; display: block; }

  /* Subtitle Bar */
  .subtitle-bar {
    padding: 12px 20px;
    background: #1e293b;
    color: #f8fafc;
    font-size: 14px;
    line-height: 1.5;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sub-text { flex: 1; }
  .sub-tag {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    color: #cbd5e1;
    white-space: nowrap;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    background: #fff;
    border-top: 1px solid var(--border);
  }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-loop-on { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
  .btn-muted { background: #f1f5f9; color: var(--muted); }

  /* Drawer */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    z-index: 40;
  }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(340px, 88vw);
    background: #fff;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 24px rgba(15,23,42,0.15);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .drawer-title { font-size: 17px; font-weight: 800; }
  .drawer-search {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-search input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .drawer-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 6px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #f8fafc;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }
  .tab-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .drawer-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .word-item {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .word-item:hover { background: #f8fafc; }
  .word-item.active { background: var(--primary-light); border-color: #c7d2fe; }
  .wi-main { flex: 1; }
  .wi-word { font-size: 15px; font-weight: 800; color: var(--ink); }
  .wi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .wi-icons { font-size: 14px; display: flex; gap: 4px; }

  /* SVG Animations */
  .act-group { display: none; }
  .act-group.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @keyframes rideIn {
    0% { transform: translateX(-160px); }
    55% { transform: translateX(180px); }
    70% { transform: translateX(195px) rotate(-14deg); }
    85% { transform: translateX(205px) rotate(18deg); }
    100% { transform: translateX(210px) rotate(22deg); }
  }
  .bike-crash { transform-origin: 220px 330px; animation: rideIn 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes flyBook {
    0%, 55% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    65% { opacity: 1; }
    100% { transform: translate(110px, -110px) rotate(140deg); opacity: 1; }
  }
  .flying-book { animation: flyBook 3.2s ease-out forwards; }
  @keyframes popBang {
    0%, 60% { transform: scale(0); opacity: 0; }
    75% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .bang-pop { transform-origin: 430px 230px; animation: popBang 3.2s ease-out forwards; }

  @keyframes rainDrop {
    0% { transform: translateY(-15px); opacity: 0; }
    30% { opacity: 0.85; }
    100% { transform: translateY(110px); opacity: 0; }
  }
  .rain { animation: rainDrop 1.1s linear infinite; }
  .rain-d2 { animation-delay: 0.35s; }
  .rain-d3 { animation-delay: 0.7s; }
  @keyframes umbrellaOpen {
    0% { transform: scale(0.3) translateY(20px); opacity: 0; }
    60% { transform: scale(1.06) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .umbrella-pop { transform-origin: 265px 235px; animation: umbrellaOpen 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes shiver {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .shiver-boy { animation: shiver 0.35s ease-in-out infinite; }
  @keyframes badgePop {
    0% { transform: scale(0.75); opacity: 0; }
    70% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes floatUp {
    0% { transform: translateY(18px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .anim-float { animation: floatUp 0.8s ease-out forwards; }
  @keyframes slideRight {
    0% { transform: translateX(-60px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }
  .anim-slide { animation: slideRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes pulsePop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .anim-pulse { transform-box: fill-box; transform-origin: center; animation: pulsePop 1.6s ease-in-out infinite; }

  .badge-anim { transform-origin: 400px 108px; animation: badgePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
</style>
</head>
<body>

<!-- Word Bank Drawer -->
<div id="drawer-backdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <span class="drawer-title">📚 考纲词库目录</span>
    <button class="icon-btn" onclick="closeDrawer()">✕ 关闭</button>
  </div>
  <div class="drawer-search">
    <input id="search-input" type="text" placeholder="搜索英文单词或中文释义..." oninput="renderDrawerList()" />
  </div>
  <div class="drawer-tabs">
    <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
    <button class="tab-btn" data-filter="starred" onclick="setFilter('starred')">⭐ 重点必背</button>
    <button class="tab-btn" data-filter="mastered" onclick="setFilter('mastered')">✅ 已掌握</button>
  </div>
  <div id="drawer-list" class="drawer-list"></div>
</aside>

<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="top-left">
      <button class="icon-btn" onclick="openDrawer()">📚 词库 (<span id="word-count">0</span>)</button>
      <div class="word-meta">
        <span id="ui-word" class="word-title"></span>
        <span id="ui-phonetic" class="phonetic"></span>
        <span id="ui-pos" class="pos-badge"></span>
        <span id="ui-meaning" class="meaning"></span>
      </div>
    </div>
    <div class="top-right">
      <button id="btn-star" class="icon-btn" onclick="toggleStar()">☆ 重点</button>
      <button id="btn-master" class="icon-btn" onclick="toggleMaster()">○ 掌握</button>
      <div class="act-dots" title="点击切换幕数">
        <button class="dot active" data-act="1" onclick="jumpToAct(1)">1</button>
        <button class="dot" data-act="2" onclick="jumpToAct(2)">2</button>
        <button class="dot" data-act="3" onclick="jumpToAct(3)">3</button>
        <button class="dot" data-act="4" onclick="jumpToAct(4)">4</button>
      </div>
    </div>
  </div>

  <!-- SVG Stage -->
  <div class="stage-wrap">
    <svg id="stage" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Subtitle Bar -->
  <div class="subtitle-bar">
    <div id="sub-text" class="sub-text">点击「▶ 开始动画配音」，开启 4 幕沉浸式记忆！</div>
    <div id="sub-tag" class="sub-tag">准备就绪</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" onclick="prevWord()">◀ 上一词</button>
    <button id="btn-play" class="btn btn-primary" onclick="startFullSequence()">▶ 开始动画配音</button>
    <button class="btn" onclick="playThreePassWord()">🔁 连读 3 遍</button>
    <button class="btn" onclick="playExampleSentence()">🗣️ 慢速例句</button>
    <button id="btn-loop" class="btn" onclick="toggleAutoNext()">🔁 连播：关</button>
    <button id="btn-mute" class="btn" onclick="toggleMute()">🎙️ 配音：开启</button>
    <button class="btn" onclick="nextWord()">下一词 ▶</button>
  </div>
</div>

<script src="./words.js"></script>
<script>
  const bank = window.WORD_BANK || [];
  let currentIndex = 0;
  let currentFilter = 'all';
  let autoNext = false;
  let isMuted = false;
  let runToken = 0;

  let starredSet = new Set(JSON.parse(localStorage.getItem('wp_starred') || '[]'));
  let masteredSet = new Set(JSON.parse(localStorage.getItem('wp_mastered') || '[]'));

  function saveState() {
    localStorage.setItem('wp_starred', JSON.stringify([...starredSet]));
    localStorage.setItem('wp_mastered', JSON.stringify([...masteredSet]));
  }

  // --- Voice Locking ---
  let enVoice = null;
  let zhVoice = null;
  let voicesLoaded = false;

  function pickVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    const enPriority = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Alex'];
    enVoice = voices.find(v => enPriority.some(p => v.name.includes(p)) && (v.lang === 'en-US' || v.lang === 'en_US'))
           || voices.find(v => v.lang === 'en-US' || v.lang === 'en_US')
           || voices.find(v => v.lang.startsWith('en')) || null;

    const zhPriority = ['Ting-Ting', 'Google 普通话', 'Microsoft Xiaoxiao', 'Microsoft Yaoyao'];
    zhVoice = voices.find(v => zhPriority.some(p => v.name.includes(p)) && v.lang.startsWith('zh'))
           || voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN')
           || voices.find(v => v.lang.startsWith('zh')) || null;
    voicesLoaded = true;
  }
  if ('speechSynthesis' in window) {
    pickVoices();
    window.speechSynthesis.onvoiceschanged = pickVoices;
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  async function ensureVoicesReady() {
    if (voicesLoaded || !('speechSynthesis' in window)) return;
    pickVoices();
    for (let i = 0; i < 8 && !voicesLoaded; i++) { await sleep(75); pickVoices(); }
  }

  function stopAllAudio() {
    runToken++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function speak(text, lang = 'en-US', rate = 0.95) {
    return new Promise(resolve => {
      if (isMuted || !('speechSynthesis' in window)) {
        setTimeout(resolve, Math.max(700, text.length * 60));
        return;
      }
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      const utter = new SpeechSynthesisUtterance(text);
      window.__activeUtter = utter;
      utter.pitch = 1.0;
      utter.volume = 1.0;
      utter.rate = rate;
      if (lang.startsWith('en') && enVoice) { utter.voice = enVoice; utter.lang = enVoice.lang; }
      else if (lang.startsWith('zh') && zhVoice) { utter.voice = zhVoice; utter.lang = zhVoice.lang; }
      else { utter.lang = lang; }
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      utter.onend = finish;
      utter.onerror = finish;
      window.speechSynthesis.speak(utter);
    });
  }

  // --- Web Audio SFX ---
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSceneSfx(type) {
    if (isMuted) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    if (type === 'crash') {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.4);
    } else {
      [720, 880, 660].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.16);
        gain.gain.setValueAtTime(0.12, now + i * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.005, now + i * 0.16 + 0.14);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i * 0.16); osc.stop(now + i * 0.16 + 0.15);
      });
    }
  }
  function playUnlockSfx() {
    if (isMuted) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);
      gain.gain.setValueAtTime(0.16, now + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.005, now + i * 0.09 + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.32);
    });
  }

  // --- Render Word Stage ---
  function renderWord(idx) {
    currentIndex = idx;
    const w = bank[idx];
    if (!w) return;

    document.documentElement.style.setProperty('--primary', w.themeColor || '#4f46e5');
    document.getElementById('word-count').textContent = bank.length;
    document.getElementById('ui-word').textContent = w.word;
    document.getElementById('ui-phonetic').textContent = w.phonetic;
    document.getElementById('ui-pos').textContent = w.pos;
    document.getElementById('ui-meaning').textContent = w.meaning;

    updateStatusButtons();

    // Build Syllable Boxes for Act 1
    const n = w.syllables.length;
    const boxW = Math.min(140, Math.floor(540 / n) - 18);
    const totalW = n * boxW + (n - 1) * 24;
    const startX = (800 - totalW) / 2;
    const sylHtml = w.syllables.map((s, i) => {
      const x = startX + i * (boxW + 24);
      const dot = i < n - 1 ? `<text x="${x + boxW + 12}" y="175" text-anchor="middle" font-size="28" font-weight="700" fill="#94a3b8">·</text>` : '';
      return `<rect class="syl-box" x="${x}" y="125" width="${boxW}" height="80" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
              <text x="${x + boxW / 2}" y="175" text-anchor="middle" font-size="32" font-weight="800" fill="${w.themeColor}">${s}</text>${dot}`;
    }).join('');

    const stage = document.getElementById('stage');
    stage.innerHTML = `
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e0e7ff"/>
          <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>
      </defs>
      <rect width="800" height="450" fill="url(#skyGrad)"/>

      <g id="act-1" class="act-group active">
        <rect x="60" y="40" width="680" height="370" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
        <text x="400" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">第 1 幕 · 三遍连读 + 词根秒记口诀</text>
        ${sylHtml}
        <rect x="100" y="240" width="600" height="130" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
        <text x="400" y="278" text-anchor="middle" font-size="20" font-weight="800" fill="#ea580c">💡 词根秒记口诀</text>
        <text x="400" y="314" text-anchor="middle" font-size="18" font-weight="600" fill="#1e293b">${w.mnemonicFormula}</text>
        <text x="400" y="346" text-anchor="middle" font-size="17" fill="#475569">${w.mnemonicDesc}</text>
      </g>

      <g id="act-2" class="act-group">
        ${w.act2Svg}
        <rect x="20" y="20" width="275" height="38" rx="10" fill="rgba(255,255,255,0.92)"/>
        <text x="157" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">${w.act2Title}</text>
      </g>

      <g id="act-3" class="act-group">
        <rect x="60" y="35" width="680" height="380" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
        <g class="badge-anim">
          <rect x="200" y="62" width="400" height="84" rx="18" fill="${w.themeColor}"/>
          <text x="400" y="100" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">${w.word}</text>
          <text x="400" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#e0e7ff">${w.pos} ${w.meaning}</text>
        </g>
        <rect x="95" y="176" width="295" height="202" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
        <text x="242" y="210" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">📌 中高考高频搭配</text>
        <text x="242" y="252" text-anchor="middle" font-size="20" font-weight="800" fill="#166534">${w.collocationTitle}</text>
        <text x="242" y="286" text-anchor="middle" font-size="14" fill="#1e293b">${w.collocationSub}</text>
        <text x="242" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">${w.collocationTip1}</text>
        <text x="242" y="348" text-anchor="middle" font-size="13" fill="#475569">${w.collocationTip2}</text>

        <rect x="410" y="176" width="295" height="202" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
        <text x="557" y="210" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">🔄 常见词性变形</text>
        <text x="557" y="255" text-anchor="middle" font-size="22" font-weight="800" fill="#1e40af">${w.family1Word}</text>
        <text x="557" y="282" text-anchor="middle" font-size="15" fill="#475569">${w.family1Desc}</text>
        <text x="557" y="326" text-anchor="middle" font-size="21" font-weight="800" fill="#1e40af">${w.family2Word}</text>
        <text x="557" y="352" text-anchor="middle" font-size="14" fill="#475569">${w.family2Desc}</text>
      </g>

      <g id="act-4" class="act-group">
        <rect x="60" y="40" width="680" height="370" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
        <rect x="260" y="68" width="280" height="36" rx="18" fill="#eef2ff"/>
        <text x="400" y="92" text-anchor="middle" font-size="16" font-weight="800" fill="${w.themeColor}">✍️ 第 4 幕 · 真题作文加分例句</text>
        <text x="400" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">${w.sentenceLine1}</text>
        <text x="400" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">${w.sentenceLine2}</text>
        <text x="400" y="258" text-anchor="middle" font-size="17" fill="#64748b">${w.sentenceZh}</text>
        <rect x="105" y="298" width="590" height="74" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="400" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">${w.sentenceTip1}</text>
        <text x="400" y="352" text-anchor="middle" font-size="14" fill="#475569">${w.sentenceTip2}</text>
      </g>
    `;
    setAct(1);
    setSubtitle(`已加载「${w.word}」— 点击「▶ 开始动画配音」开始学习`, '准备就绪');
    renderDrawerList();
  }

  function updateStatusButtons() {
    const w = bank[currentIndex];
    if (!w) return;
    const starBtn = document.getElementById('btn-star');
    const masterBtn = document.getElementById('btn-master');
    const isStar = starredSet.has(w.id);
    const isMaster = masteredSet.has(w.id);
    starBtn.textContent = isStar ? '⭐ 重点' : '☆ 重点';
    starBtn.classList.toggle('starred', isStar);
    masterBtn.textContent = isMaster ? '✅ 已掌握' : '○ 掌握';
    masterBtn.classList.toggle('mastered', isMaster);
  }

  function toggleStar() {
    const w = bank[currentIndex];
    if (!w) return;
    if (starredSet.has(w.id)) starredSet.delete(w.id); else starredSet.add(w.id);
    saveState();
    updateStatusButtons();
    renderDrawerList();
  }

  function toggleMaster() {
    const w = bank[currentIndex];
    if (!w) return;
    if (masteredSet.has(w.id)) masteredSet.delete(w.id); else masteredSet.add(w.id);
    saveState();
    updateStatusButtons();
    renderDrawerList();
  }

  // --- Drawer & Filtering ---
  function getFilteredIndices() {
    const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
    return bank.map((w, i) => ({ w, i })).filter(({ w }) => {
      if (currentFilter === 'starred' && !starredSet.has(w.id)) return false;
      if (currentFilter === 'mastered' && !masteredSet.has(w.id)) return false;
      if (q && !w.word.toLowerCase().includes(q) && !w.meaning.includes(q)) return false;
      return true;
    }).map(x => x.i);
  }

  function renderDrawerList() {
    const listEl = document.getElementById('drawer-list');
    const indices = getFilteredIndices();
    if (!indices.length) {
      listEl.innerHTML = '<div style="padding:24px;text-align:center;color:#94a3b8;font-size:14px;">暂无匹配的单词</div>';
      return;
    }
    listEl.innerHTML = indices.map(i => {
      const w = bank[i];
      const active = i === currentIndex ? 'active' : '';
      const starIcon = starredSet.has(w.id) ? '⭐' : '';
      const masterIcon = masteredSet.has(w.id) ? '✅' : '';
      return `<div class="word-item ${active}" onclick="selectWord(${i})">
        <div class="wi-main">
          <div class="wi-word">${w.word}</div>
          <div class="wi-sub">${w.pos} ${w.meaning}</div>
        </div>
        <div class="wi-icons">${starIcon}${masterIcon}</div>
      </div>`;
    }).join('');
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    renderDrawerList();
  }
  function openDrawer() {
    renderDrawerList();
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer-backdrop').classList.add('open');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer-backdrop').classList.remove('open');
  }
  function selectWord(i) {
    stopAllAudio();
    renderWord(i);
    closeDrawer();
  }
  function prevWord() {
    stopAllAudio();
    const list = getFilteredIndices();
    if (!list.length) return;
    const pos = list.indexOf(currentIndex);
    const nextIdx = pos <= 0 ? list[list.length - 1] : list[pos - 1];
    renderWord(nextIdx);
  }
  function nextWord(autoPlay = false) {
    stopAllAudio();
    const list = getFilteredIndices();
    if (!list.length) return;
    const pos = list.indexOf(currentIndex);
    const nextIdx = pos === -1 || pos >= list.length - 1 ? list[0] : list[pos + 1];
    renderWord(nextIdx);
    if (autoPlay) startFullSequence();
  }

  // --- Stage & Playback ---
  function setAct(num) {
    document.querySelectorAll('.act-group').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(`act-${num}`);
    if (target) target.classList.add('active');
    document.querySelectorAll('.dot').forEach(d => d.classList.toggle('active', Number(d.dataset.act) === num));
  }
  function setSubtitle(text, tag = '') {
    document.getElementById('sub-text').textContent = text;
    document.getElementById('sub-tag').textContent = tag;
  }
  function highlightSyllables(active) {
    document.querySelectorAll('.syl-box').forEach(el => {
      el.setAttribute('fill', active ? '#c7d2fe' : '#eef2ff');
    });
  }
  function toggleMute() {
    isMuted = !isMuted;
    const btn = document.getElementById('btn-mute');
    if (isMuted) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      btn.textContent = '🔇 配音：静音';
      btn.classList.add('btn-muted');
    } else {
      btn.textContent = '🎙️ 配音：开启';
      btn.classList.remove('btn-muted');
    }
  }
  function toggleAutoNext() {
    autoNext = !autoNext;
    const btn = document.getElementById('btn-loop');
    btn.textContent = autoNext ? '🔁 连播：开启' : '🔁 连播：关';
    btn.classList.toggle('btn-loop-on', autoNext);
  }
  function jumpToAct(num) {
    stopAllAudio();
    setAct(num);
    setSubtitle(`已切换到第 ${num} 幕`, `第 ${num}/4 幕`);
  }

  async function playThreePassWord(tokenOverride = null) {
    const myToken = tokenOverride !== null ? tokenOverride : ++runToken;
    if (tokenOverride === null && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    await ensureVoicesReady();
    setAct(1);
    const w = bank[currentIndex];
    const passes = [
      { rate: 0.72, label: '第 1/3 遍 · 慢速拆音 (0.72x)', text: `${w.syllables.join(' · ')} — 慢速拆分音节跟读` },
      { rate: 0.92, label: '第 2/3 遍 · 标准语速 (0.92x)', text: `${w.word} — 标准语速跟读` },
      { rate: 1.0,  label: '第 3/3 遍 · 轻快巩固 (1.0x)',  text: `${w.word} — 轻快强化记忆！` }
    ];
    for (const p of passes) {
      if (myToken !== runToken) return;
      setSubtitle(p.text, p.label);
      highlightSyllables(true);
      await speak(w.speakWord || w.word, 'en-US', p.rate);
      highlightSyllables(false);
      await sleep(400);
    }
  }

  async function playExampleSentence(tokenOverride = null) {
    const myToken = tokenOverride !== null ? tokenOverride : ++runToken;
    if (tokenOverride === null && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    await ensureVoicesReady();
    setAct(4);
    await sleep(120);
    const w = bank[currentIndex];
    setSubtitle(`${w.sentenceFull}（慢速清晰跟读 0.78x）`, '真题作文例句');
    await speak(w.sentenceFull, 'en-US', 0.78);
    if (myToken !== runToken) return;
    await sleep(420);
    setSubtitle(`强化跟读目标词：${w.word}（${w.meaning}）`, '强化跟读');
    await speak(w.speakWord || w.word, 'en-US', 1.0);
  }

  async function startFullSequence() {
    stopAllAudio();
    const myToken = runToken;
    await ensureVoicesReady();
    const w = bank[currentIndex];

    await playThreePassWord(myToken);
    if (myToken !== runToken) return;
    setSubtitle(`记忆口诀：${w.mnemonicFormula}`, '第 1/4 幕 · 口诀');
    await speak(w.mnemonicSpeech, 'zh-CN', 1.0);
    if (myToken !== runToken) return;
    await sleep(420);

    setAct(2);
    playSceneSfx(w.act2Sfx);
    setSubtitle(w.act2Subtitle, '第 2/4 幕 · 剧情演绎');
    await speak(w.act2Narration, 'zh-CN', 1.0);
    if (myToken !== runToken) return;
    await sleep(420);

    setAct(3);
    playUnlockSfx();
    setSubtitle(`高频考点：${w.collocationTitle}（${w.collocationSub}）`, '第 3/4 幕 · 考点拓展');
    await speak(w.collocationSpeech, 'zh-CN', 1.0);
    if (myToken !== runToken) return;
    await sleep(450);

    await playExampleSentence(myToken);
    if (myToken !== runToken) return;

    if (autoNext) {
      await sleep(900);
      if (myToken !== runToken) return;
      nextWord(true);
    }
  }

  // Init
  renderWord(0);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
